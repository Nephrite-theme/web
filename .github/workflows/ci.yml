# Lints, type-checks and builds the site on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm's version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm check
      # The build compiles Paraglide's messages, which the type check imports.
      - run: pnpm build
      - name: Type check
        run: pnpm exec tsc --noEmit
